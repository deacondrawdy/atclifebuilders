services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atc_lifebuilders
    ports:
      - '5432:5432'
    volumes:
      - atc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d atc_lifebuilders']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atc_pgdata:
